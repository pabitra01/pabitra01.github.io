<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PabiStudio</title>
    <meta name="description" content="PabiStudio makes ClassMate, a timetable and attendance app for students." />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        color: #333;
        background: #f8f9fa;
        padding: 20px;
      }

      .container {
        max-width: 720px;
        margin: 0 auto;
        background: #fff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 30px;
        color: #6c5ce7;
        margin-bottom: 6px;
      }

      .subtitle {
        color: #666;
        font-size: 15px;
        margin-bottom: 28px;
      }

      .app {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 0;
        border-top: 1px solid #eee;
      }

      .app img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        flex-shrink: 0;
      }

      .app h2 {
        font-size: 17px;
        color: #2d3436;
      }

      .app p {
        font-size: 14px;
        color: #666;
      }

      a {
        color: #6c5ce7;
      }

      .contact {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        font-size: 14px;
        color: #666;
      }

      .footer {
        margin-top: 28px;
        font-size: 13px;
        color: #999;
        text-align: center;
      }

      @media (max-width: 520px) {
        body {
          padding: 12px;
        }

        .container {
          padding: 24px 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>PabiStudio</h1>
      <p class="subtitle">Simple, focused apps for everyday life on Android.</p>

      <div class="app">
        <img src="classmate_icon.png" alt="ClassMate icon" />
        <div>
          <h2>ClassMate</h2>
          <p>
            Timetable, attendance tracker, homework and exams for students.
            <a href="/privacy-policies/classmate.html">Privacy policy</a>
          </p>
        </div>
      </div>

      <p class="contact">
        Contact: <a href="mailto:pabi.studio.dev@gmail.com">pabi.studio.dev@gmail.com</a>
      </p>

      <div class="footer">© 2026 PabiStudio</div>
    </div>
  </body>
</html>
